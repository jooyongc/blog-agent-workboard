name: Validate Workboard
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            workboard/package-lock.json
      - run: npm ci
      - run: npm ci --prefix workboard
      - run: npm run typecheck && npm test && npm run validate-configs
      - run: npm run workboard:test && npm run build
