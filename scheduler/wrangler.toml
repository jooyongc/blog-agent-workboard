name = "blog-agent-workboard-scheduler"
main = "index.ts"
compatibility_date = "2026-10-05"
[triggers]
crons = ["*/15 * * * *"]
[vars]
WORKBOARD_URL = "https://blog-agent-workboard.pages.dev"

[[queues.producers]]
binding = "AGENT_QUEUE"
queue = "blog-agent-workboard-agents"

[[queues.consumers]]
queue = "blog-agent-workboard-agents"
max_batch_size = 1
max_batch_timeout = 1
max_concurrency = 1
max_retries = 3
dead_letter_queue = "blog-agent-workboard-agents-dead"
